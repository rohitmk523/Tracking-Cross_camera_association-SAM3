[project]
name = "uball-cc"
version = "0.1.0"
description = "General-purpose cross-camera basketball tracking + spatial world model + VLM narration"
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Core deps are deliberately light so the data/eval tooling installs fast and
# runs anywhere. Heavy / device-specific deps (torch, rfdetr, sahi, supervision)
# live in optional groups and are installed only where they run (baseline eval,
# AWS GPU training). See docs/02_tech_stack.md for the full component list.
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "pycocotools>=2.0.7",
    "tqdm>=4.66",
    "boto3>=1.34",          # AWS GPU training scaffold (scripts/aws_train.py)
]

[project.optional-dependencies]
# Local baseline inference + (CUDA-only) RF-DETR training. RF-DETR's ops deadlock
# on Apple MPS for TRAINING (CUDA only) -- inference on MPS/CPU is fine for the
# baseline eval. See docs/04_detection.md.
baseline = [
    "torch>=2.2",
    "rfdetr>=1.1",
    "supervision>=0.22",
]
# Small-object sliced inference / fine-tune on the far-endline ROI band.
sahi = ["sahi>=0.11.18"]
# Per-camera tracking (docs/05). `trackers` (Roboflow) is the supported ByteTrack/
# BoT-SORT/SORT successor to supervision's deprecated bundled tracker; supervision
# supplies the Detections container; motmetrics powers the MOTA/IDF1 eval;
# scikit-learn (KMeans) + transformers SigLIP (from `baseline`) do team classification.
tracking = [
    "trackers>=2.4", "supervision>=0.28", "motmetrics>=1.4", "scikit-learn>=1.3",
    "torchreid>=1.4", "gdown", "tensorboard",   # OSNet ReID (torchreid imports tensorboard/gdown eagerly)
    "torchvision>=0.16",                         # jersey-number ResNet-18 reader
    "nltk",                                      # PARSeq STR via torch.hub (scripts/eval_parseq_zeroshot.py)
]
# Cross-camera fusion (docs/06): Hungarian (scipy) + court model from the DXF (ezdxf).
fusion = ["scipy>=1.10", "ezdxf>=1.1"]
# End-to-end pipeline server (scripts/pipeline_server.py): orchestrates detect→track→
# fuse→VLM over the 4 angles. Needs `baseline`+`tracking`+`fusion` for the CV phases.
pipeline = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0", "python-multipart>=0.0.9",
            "google-genai>=1.0", "python-dotenv>=1.0"]
# Human-in-the-loop annotation UI (scripts/annotate.py).
annotate = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uball_cc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
