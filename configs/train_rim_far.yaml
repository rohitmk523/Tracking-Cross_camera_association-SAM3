# RF-DETR FAR-angle ball+hoop detector (replaces the AGPL YOLO far model).
# OUR footage; YOLO label format (no ultralytics). Data: scripts/prep_rim_datasets.py
model: small
resolution: 1280            # ball is tiny from the far cams -> high-res
epochs: 60
batch_size: 4         # RF-DETR-S @1280 OOMs at batch 8 on A10G 24GB; 4 fits
grad_accum: 4         # effective batch 16
early_stopping: true
early_stopping_patience: 12
class_names: [Basketball, Basketball Hoop]
dataset: data/rim_far       # far data_rfdetr (incl. old-facility frames; ablate later)
run_name: rfdetr-rim-far-v1

sahi:
  enabled: false

aws:
  region: us-east-1
  instance_type: g5.2xlarge
  ami: ami-012ba162b9cd2729c     # DL AMI (PyTorch+CUDA), us-east-1 -- VERIFY before launch
  volume_gb: 120
  s3_bucket: uball-videos-production
  s3_prefix: _tmp_rfdetr_train
  flagged_account: "840102831548"
