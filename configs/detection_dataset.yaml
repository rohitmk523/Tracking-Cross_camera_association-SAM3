# Consolidation policy for the player/referee/ball detection dataset (docs/04).
# OUR FOOTAGE ONLY. Read by scripts/build_detection_dataset.py.
#
# Canonical taxonomy (output YOLO ids): 0=player, 1=referee, 2=ball.
target_classes: [player, referee, ball]

# ---------------------------------------------------------------------------
# Sources. `class_map` remaps each source's raw YOLO class id -> canonical name
# (null = drop that id). Only `include: true` sources are consolidated.
# ---------------------------------------------------------------------------
sources:
  - name: annotate_pool_events      # event-anchored NEAR-cam shot frames (25 games) -> strong BALL labels
    path: data/annotate_pool_events # built 2026-06-29 from the plays table (docs/08, near basket = big ball)
    repo_relative: true
    include: false                  # GATE: flip to true ONLY after the operator corrects the pre-labels
    priority: 0                     # authoritative; lower wins on duplicate frames
    class_map: {0: player, 1: referee, 2: ball}

  - name: annotate_pool             # operator-APPROVED pool: 11 games, all 4 angles, ball+ref
    path: data/annotate_pool        # repo-relative (in-repo data/, not Training_frameworks)
    repo_relative: true
    include: true
    priority: 0                     # authoritative; lower wins on duplicate frames
    class_map: {0: player, 1: referee, 2: ball}

  - name: 4cam_detection            # legacy cross-game set: e6fba750 (train) + c2a354fe (test)
    path: "Uball 4Cam Detection/data"
    include: true
    priority: 1                     # pool wins any overlap (lower priority wins)
    class_map: {0: player, 1: referee, 2: ball}

  # e6-only, redundant with 4Cam's e6 frames, and carries an unnamed/ambiguous
  # cls2 (not confirmed as ball -> NOT mapped). Off by default; enable only after
  # verifying cls2 and deduping against 4Cam.
  - name: e6_demo
    path: "Uball E6 Demo/data"
    include: false
    priority: 1
    class_map: {0: player, 1: referee}     # cls2 dropped (ambiguous)

  - name: e6_perfect
    path: "Uball E6 Demo/data_perfect"
    include: false
    priority: 2
    class_map: {0: player, 1: referee}     # cls2 dropped (ambiguous); yaml empty

  # Far/Near Angle are a DIFFERENT task (Basketball/Hoop = shot detection),
  # not player/referee. Never folded into this set (partial labels would teach
  # "no players here"). Kept for the separate shot-detection model.
  - name: far_angle_rim
    path: "Uball Far Angle/data_rfdetr"
    include: false
  - name: near_angle_rim
    path: "Uball Near Angle/data/yolo_split"
    include: false

# ---------------------------------------------------------------------------
# Cross-game splits (whole-game discipline; never random-frame). Maps gid8 ->
# split. Only games listed here are emitted. Default holds c2a354fe per docs/14.
# (All current footage is court-a -> this is a cross-GAME, not yet cross-COURT,
# split. Annotate a 3rd game from the "fresh" set to make val != test.)
# ---------------------------------------------------------------------------
split_map:
  # annotate_pool train games (8) + legacy e6fba750 (extra train; ball=0)
  2399cfac: train
  2c490f1a: train
  922bff3b: train
  95d2ea95: train
  9eb51980: train
  d0a9faef: train
  d186e25e: train
  d446fe8c: train
  e6fba750: train
  # event-pool train games (added 2026-06-29; near-cam shot frames, strong ball labels)
  0fa23810: train
  13e1ffad: train
  6d601c99: train
  77715f25: train
  8dcb1330: train
  b3c1f62c: train
  cc1710c4: train
  f66eb3b2: train
  ee8745f1: train
  # annotate_pool valid games (3) + 2 event-pool valid games -> stronger cross-game validation
  29b51d57: valid
  74c4f686: valid
  b68967fe: valid
  cc5deb39: valid
  cd045da8: valid
  # held-out TEST anchor (docs/14; from 4cam_detection, ball unlabeled there) + f3e7b25a
  c2a354fe: test
  f3e7b25a: test

# val_mode: keep the held-out TEST game (c2a, docs/14) truly untouched.
#   explicit       -> valid = the WHOLE games mapped to `valid` above (real cross-game
#                     validation, distinct from test). No tail carving.  <-- current
#   temporal_holdout -> carve `val_fraction` of the train game (by frame order, per
#                     angle) as an in-domain val; TEST stays clean.
#   held_out_game  -> val == test game. REJECTED as default: early-stopping would
#                     select on the test set (review #5/#7).
val_mode: explicit
val_fraction: 0.1            # unused when val_mode: explicit

keep_empty_frames: false     # drop frames with no target instance after remap
image_mode: copy             # copy | symlink (copy = self-contained for AWS bundle)
out_dir: data/detect_consolidated
